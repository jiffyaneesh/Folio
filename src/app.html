<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0a0a0a" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

		<!-- Primary SEO -->
		<title>Folio — Offline-first PDF reader for deep reading</title>
		<meta
			name="description"
			content="Folio is a fast, offline-first PDF reader built for deep reading: highlights, notes, full-text search, and spaced-repetition flashcards — all stored privately in your browser."
		/>
		<meta
			name="keywords"
			content="PDF reader, offline PDF, deep reading, highlights, notes, full-text search, spaced repetition, flashcards, PWA, study tool"
		/>
		<meta name="author" content="Folio" />
		<meta name="robots" content="index, follow" />
		<link rel="canonical" href="https://folioapp.pages.dev/" />

		<!-- Open Graph -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Folio" />
		<meta property="og:title" content="Folio — Offline-first PDF reader for deep reading" />
		<meta
			property="og:description"
			content="A fast, offline-first PDF reader built for deep reading: highlights, notes, full-text search, and spaced-repetition flashcards — all stored privately in your browser."
		/>
		<meta property="og:url" content="https://folioapp.pages.dev/" />
		<meta property="og:image" content="https://folioapp.pages.dev/folio_linkedin_graphic.png" />
		<meta property="og:image:alt" content="Folio — focused offline-first PDF reader" />
		<meta property="og:image:width" content="1264" />
		<meta property="og:image:height" content="843" />

		<!-- Twitter / X -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Folio — Offline-first PDF reader for deep reading" />
		<meta
			name="twitter:description"
			content="A fast, offline-first PDF reader built for deep reading: highlights, notes, full-text search, and spaced-repetition flashcards — all stored privately in your browser."
		/>
		<meta name="twitter:image" content="https://folioapp.pages.dev/folio_linkedin_graphic.png" />
		<meta name="twitter:image:alt" content="Folio — focused offline-first PDF reader" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-25..0&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
